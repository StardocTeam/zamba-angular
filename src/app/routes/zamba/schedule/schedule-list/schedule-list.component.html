<div class="schedule-container">
  <div class="toolbar">
    <h2>Schedules</h2>
    <button nz-button nzType="primary" (click)="goToCreate()">New Schedule</button>
  </div>
  <nz-spin [nzSpinning]="loading">
    <nz-table [nzData]="schedules" nzSize="small">
      <thead>
        <tr>
          <th>Name</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of schedules">
          <td>{{ item.name }}</td>
          <td><nz-tag [nzColor]="item.isActive ? 'green' : 'default'">{{ item.isActive ? 'Active' : 'Inactive'
              }}</nz-tag></td>
          <td>
            <button nz-button nzType="link" nzSize="small">Edit</button>
            <button nz-button nzType="link" nzSize="small">Delete</button>
          </td>
        </tr>
      </tbody>
    </nz-table>
  </nz-spin>
</div>
