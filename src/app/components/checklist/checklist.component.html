<div class="checklist-card">
  <h3>Checklist</h3>

  <div class="add-row">
    <input [(ngModel)]="newTitle" placeholder="New item title" />
    <button (click)="add()">Add</button>
  </div>

  <ul class="checklist">
    <li *ngFor="let it of items; trackBy: trackById" class="item">
      <div class="left">
        <span class="icon" [ngClass]="{ 'success': it.done, 'pending': !it.done }">
          {{ it.done ? '✓' : '⏳' }}
        </span>
        <span class="title" [class.done]="it.done">{{ it.title }}</span>
      </div>

      <div class="actions">
        <button (click)="toggle(it)">{{ it.done ? 'Undo' : 'Done' }}</button>
        <button class="danger" (click)="remove(it)">Remove</button>
      </div>
    </li>
  </ul>
</div>
