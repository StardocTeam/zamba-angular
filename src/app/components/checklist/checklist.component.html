<div class="checklist-card" [ngStyle]="cardStyle">

  <ul class="checklist" [ngStyle]="listStyle">
    <li *ngFor="let it of items; trackBy: trackById" class="item">
      <div class="left">
        <span class="icon" [ngClass]="{ 'success': it.done, 'pending': !it.done }">
          <i nz-icon [nzType]="it.done ? 'check-circle' : 'clock-circle'"></i>
        </span>
        <span class="title" [class.done]="it.done">{{ it.title }}</span>
      </div>
    </li>
  </ul>
</div>
