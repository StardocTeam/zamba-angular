<div class="editor-page">
  <nz-card [nzBordered]="false">
    <div class="intro" *ngIf="statusMessage || errorMessage">
      <nz-alert *ngIf="statusMessage" nzType="info" nzShowIcon [nzMessage]="statusMessage" nzCloseable (nzOnClose)="statusMessage = ''" />
      <nz-alert *ngIf="errorMessage" nzType="error" nzShowIcon [nzMessage]="errorMessage" nzCloseable (nzOnClose)="errorMessage = ''" />
    </div>

    <input
      #localDocxInput
      hidden
      type="file"
      accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      (change)="onLocalDocxSelected($event)"
    />

    <div class="editor-host" *ngIf="isTinymceLoaded">
      <editor [licenseKey]="licenseKey" [disabled]="settings.readonly" [init]="editorInit" [(ngModel)]="editorContent" />
    </div>
  </nz-card>
</div>
