<div class="editor-page">
    <nz-card nzTitle="TinyMCE" [nzBordered]="false">
        <div class="intro">
            <p>
                Este componente usa el wrapper oficial de TinyMCE para Angular con la versión
                <strong>open-source self-hosted</strong> cargada desde el paquete de npm.
            </p>
            <div class="tags">
                <nz-tag nzColor="green">Open source / GPL</nz-tag>
                <nz-tag nzColor="blue">Self-hosted</nz-tag>
                <nz-tag nzColor="cyan">npm package</nz-tag>
                <nz-tag nzColor="green">Sin Tiny Cloud</nz-tag>
            </div>
        </div>

        <nz-alert nzType="info" nzShowIcon nzMessage="Modo self-hosted"
            nzDescription="TinyMCE se carga desde assets/tinymce usando el paquete instalado por npm. No usa Tiny Cloud, API key ni plugins premium."></nz-alert>

        <div class="switches">
            <div class="switch-item">
                <span>Solo lectura</span>
                <nz-switch [(ngModel)]="settings.readonly"></nz-switch>
            </div>
        </div>

        <div class="actions">
            <button nz-button nzType="default" (click)="useFreeDefaults()">Usar defaults open source</button>
            <button nz-button nzType="primary" (click)="createBlankDocument()">Nuevo documento en blanco</button>
            <button nz-button nzType="default" (click)="applySettings()">Aplicar configuración</button>
            <button nz-button nzType="default" (click)="loadSampleContent()">Restaurar demo</button>
            <button nz-button nzType="default" (click)="downloadHtml()">Descargar HTML</button>
        </div>

        <div class="editor-host">
            <editor [licenseKey]="licenseKey" [disabled]="settings.readonly" [init]="editorInit"
                [(ngModel)]="editorContent"></editor>
        </div>
    </nz-card>
</div>
