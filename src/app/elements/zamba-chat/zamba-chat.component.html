<button *ngIf="!isOpen" type="button" class="zamba-chat-launcher" (click)="openChat()"
  aria-label="Abrir asistente Zamba AI" aria-expanded="false" title="Abrir asistente Zamba AI">
  <span class="zamba-chat-launcher-mark" aria-hidden="true">Z</span>
  <svg class="zamba-chat-launcher-spark" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M12 2.5 14.2 9.8 21.5 12l-7.3 2.2L12 21.5l-2.2-7.3L2.5 12l7.3-2.2L12 2.5Z" />
  </svg>
</button>

<section *ngIf="isOpen" class="zamba-chat" aria-label="Asistente Zamba AI">
  <header class="zamba-chat-header">
    <div class="zamba-chat-brand">
      <span class="zamba-chat-brand-mark" aria-hidden="true">Z</span>
      <div>
        <strong>Zamba AI</strong>
        <span>Asistente de documentos</span>
      </div>
    </div>
    <button type="button" class="zamba-chat-close" (click)="closeChat()" aria-label="Cerrar chat" title="Cerrar chat">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
        <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </button>
  </header>

  <div class="zamba-chat-messages">
    <div *ngIf="messages.length === 0" class="zamba-chat-empty"> Adjuntá un archivo con el clip y escribí tu primera
      pregunta. </div>

    <div *ngFor="let message of messages" class="zamba-chat-message" [ngClass]="'zamba-chat-message--' + message.role">
      <div *ngIf="message.fileName" class="zamba-chat-message-file">📎 {{ message.fileName }}</div>
      <div class="zamba-chat-message-text">{{ message.text }}</div>
      <div *ngIf="message.role === 'assistant' && message.runId" class="zamba-chat-feedback">
        <button type="button" [class.selected]="message.feedbackRating === 1" [disabled]="message.feedbackSending"
          (click)="rateAnswer(message, 1)" title="Respuesta útil" aria-label="Respuesta útil">👍</button>
        <button type="button" [class.selected]="message.feedbackRating === -1" [disabled]="message.feedbackSending"
          (click)="rateAnswer(message, -1)" title="Respuesta no útil" aria-label="Respuesta no útil">👎</button>
        <span *ngIf="message.feedbackError" class="zamba-chat-feedback-error">No se pudo guardar la
          valoración</span>
      </div>
    </div>

    <div *ngIf="isSending" class="zamba-chat-message zamba-chat-message--assistant zamba-chat-message--typing">
      <span></span><span></span><span></span>
    </div>

    <div #messagesEnd></div>
  </div>

  <div *ngIf="errorMessage" class="zamba-chat-banner-error">{{ errorMessage }}</div>

  <div *ngIf="isExtracting" class="zamba-chat-banner-info">Extrayendo datos del documento...</div>

  <div *ngIf="pendingFileName" class="zamba-chat-pending-file">
    <span>📎 {{ pendingFileName }}</span>
    <button type="button" class="zamba-chat-remove-file" (click)="clearPendingFile()" title="Quitar archivo">×</button>
  </div>

  <div class="zamba-chat-input-row">
    <input #fileInput type="file" class="zamba-chat-file-input" (change)="onFileSelected($event)" />

    <button type="button" class="zamba-chat-clip-btn" (click)="triggerFilePicker()" [disabled]="isSending"
      title="Adjuntar archivo">
      <svg viewBox="64 64 896 896" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path
          d="M779.3 196.6c-94.2-94.2-247.6-94.2-341.7 0l-261 260.8c-1.7 1.7-2.6 4-2.6 6.4s.9 4.7 2.6 6.4l36.9 36.9a9 9 0 0012.7 0l261-260.8c32.4-32.4 75.5-50.2 121.3-50.2s88.9 17.8 121.2 50.2c32.4 32.4 50.2 75.5 50.2 121.2 0 45.8-17.8 88.8-50.2 121.2l-266 266-43.1 43.1c-40.3 40.3-105.8 40.3-146.1 0-19.5-19.5-30.2-45.4-30.2-73s10.7-53.5 30.2-73l263.9-263.8c6.7-6.6 15.5-10.3 24.9-10.3h.1c9.4 0 18.1 3.7 24.7 10.3 6.7 6.7 10.3 15.5 10.3 24.9 0 9.3-3.7 18.1-10.3 24.7L372.4 653c-1.7 1.7-2.6 4-2.6 6.4s.9 4.7 2.6 6.4l36.9 36.9a9 9 0 0012.7 0l215.6-215.6c19.9-19.9 30.8-46.3 30.8-74.4s-11-54.6-30.8-74.4c-41.1-41.1-107.9-41-149 0L226.8 604.2c-62 62-62 162.9 0 224.9 31 31 71.7 46.5 112.4 46.5 40.7 0 81.4-15.5 112.4-46.5l309.2-309.2c94.1-94.3 94.1-247.7-.1-341.9z" />
      </svg>
    </button>

    <input type="text" class="zamba-chat-text-input" placeholder="Escribí tu pregunta..." [(ngModel)]="prompt"
      (keyup.enter)="sendPrompt()" [disabled]="isSending" />

    <button type="button" class="zamba-chat-send-btn" (click)="sendPrompt()" [disabled]="!canSend()" title="Enviar">
      <svg viewBox="64 64 896 896" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path
          d="M931.4 498.9L94.9 79.5c-3.4-1.7-7.3-2.1-11-1.2a15.99 15.99 0 00-11.7 19.3l86.2 352.2c1.3 5.3 5.2 9.6 10.4 11.3l147.7 50.7-147.6 50.7c-5.2 1.7-9.1 6-10.3 11.3L72.2 926c-.9 3.7-.5 7.6 1.2 10.9 3.3 6.6 11.3 9.3 17.9 6l836.5-417.6c3.1-1.5 5.6-4.1 7.1-7.1 3.3-6.7.7-14.7-6-18.1z" />
      </svg>
    </button>
  </div>
</section>
