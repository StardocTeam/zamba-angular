<div class="web-bookmark-container">
  <div class="bookmark-header">
    <button class="add-link-btn" (click)="toggleInput()"
      *ngIf="!showInput && (!singleLinkMode || bookmarks.length === 0)"> <span class="icon">+</span> Agregar enlace
    </button>
  </div>

  <!-- Estado INPUT (Formulario) -->
  <div class="bookmark-input-view" *ngIf="showInput">
    <div class="bookmark-input-wrapper">
      <input type="text" [(ngModel)]="linkTitle" placeholder="Título opcional" class="bookmark-input" autofocus />
      <span *ngIf="linkTitle" class="clear-icon" (click)="linkTitle = ''">×</span>
    </div>

    <div class="bookmark-input-wrapper">
      <input type="text" [(ngModel)]="linkUrl" placeholder="Pegar URL" (keyup.enter)="crearMarcador()"
        class="bookmark-input" />
      <span *ngIf="linkUrl" class="clear-icon" (click)="linkUrl = ''">×</span>
    </div>

    <div class="bookmark-actions">
      <button class="bookmark-btn-cancel" (click)="toggleInput()">Cancelar</button>
      <button class="bookmark-btn" (click)="crearMarcador()" [disabled]="!linkUrl" [class.disabled-btn]="!linkUrl">Crear
        marcador</button>
    </div>
    <p class="bookmark-help">Crea un marcador visual a partir de un enlace.</p>
  </div>

  <!-- Estado LOADING -->
  <div class="bookmark-loading" *ngIf="isLoading">
    <nz-spin nzSimple />
    <p style="margin-top: 10px">Obteniendo información del enlace...</p>
  </div>

  <!-- LISTA DE ENLACES (LIFO) -->
  <div class="bookmarks-list">
    <a class="bookmark-preview-view" *ngFor="let linkData of bookmarks" [href]="linkData.url" target="_blank"
      rel="noopener noreferrer">
      <div class="bookmark-content">
        <div class="title">{{ linkData.title }}</div>
        <div class="description">{{ linkData.description }}</div>
        <div class="url-info">
          <span class="url-icon">▶</span>
          <span class="url-text">{{ linkData.url }}</span>
          <button class="copy-url-btn" (click)="copiarEnlace($event, linkData.url)" title="Copiar enlace">
            <svg viewBox="64 64 896 896" focusable="false" fill="currentColor" width="1em" height="1em" data-icon="copy"
              aria-hidden="true">
              <path
                d="M832 64H296c-4.4 0-8 3.6-8 8v56c0 4.4 3.6 8 8 8h496v688c0 4.4 3.6 8 8 8h56c4.4 0 8-3.6 8-8V96c0-17.7-14.3-32-32-32zM704 192H192c-17.7 0-32 14.3-32 32v530.7c0 8.5 3.4 16.6 9.4 22.6l173.3 172.7c6 6 14.1 9.4 22.6 9.4H704c17.7 0 32-14.3 32-32V224c0-17.7-14.3-32-32-32zM382 896h-.2L232 746.2v-.2h150v150zM664 888H424V712c0-4.4-3.6-8-8-8H192V264h472v624z" />
            </svg>
          </button>
          <button class="delete-url-btn" (click)="eliminarMarcador($event, linkData.id)" title="Eliminar marcador">
            <i nz-icon nzType="delete" nzTheme="outline"></i>
          </button>
        </div>
      </div>
      <div class="bookmark-image">
        <img *ngIf="linkData.image" [src]="linkData.image" alt="Preview" referrerpolicy="no-referrer" style="
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: translateZ(0);
            backface-visibility: hidden;
            image-rendering: high-quality;
          " />
        <div class="mock-yt-logo" *ngIf="!linkData.image && linkData.title === 'YouTube'">YouTube</div>
        <div class="mock-generic-logo" *ngIf="!linkData.image && linkData.title !== 'YouTube'">🔗</div>
      </div>
    </a>
  </div>
</div>
