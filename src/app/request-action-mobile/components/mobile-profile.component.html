<section class="profile-screen">
    <div class="profile-header"><span class="avatar">{{ username.slice(0, 1) | uppercase }}</span>
        <div>
            <h2>{{ username }}</h2>
            <p>Cuenta de Zamba</p>
        </div>
    </div>
    <form class="password-form" (ngSubmit)="save()">
        <h3>Cambiar contraseña</h3>
        <label for="current-password">Contraseña actual</label><input id="current-password" name="currentPassword"
            type="password" autocomplete="current-password" [(ngModel)]="currentPassword" required>
        <label for="new-password">Nueva contraseña</label><input id="new-password" name="newPassword" type="password"
            autocomplete="new-password" [(ngModel)]="newPassword" required minlength="8">
        <label for="confirm-password">Confirmar contraseña</label><input id="confirm-password" name="confirmation"
            type="password" autocomplete="new-password" [(ngModel)]="confirmation" required minlength="8">
        <p *ngIf="message" class="form-message" role="status">{{ message }}</p>
        <button class="save-button" type="submit"
            [disabled]="busy || !currentPassword || !newPassword || !confirmation">{{ busy ? 'Guardando…' : 'Actualizar
            contraseña' }}</button>
    </form>
    <button class="sign-out-button" type="button" (click)="signOut.emit()">Cerrar sesión</button>
</section>
